<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        .container { max-width: 560px; margin: 40px auto; background: #fff;
            border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .header   { background: #4CAF50; color: #fff; padding: 24px; text-align: center; }
        .body     { padding: 28px; color: #333; }
        .amount   { font-size: 32px; font-weight: bold; color: #4CAF50; text-align: center;
            margin: 20px 0; }
        .detail   { background: #f9f9f9; border-radius: 6px; padding: 16px; margin-top: 20px; }
        .detail p { margin: 6px 0; font-size: 14px; }
        .footer   { text-align: center; font-size: 12px; color: #aaa; padding: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>💰 Money Added Successfully!</h2>
    </div>
    <div class="body">
        <p>Hi <strong th:text="${userName}">User</strong>,</p>
        <p>Your wallet has been topped up successfully.</p>

        <div class="amount">
            +৳ <span th:text="${#numbers.formatDecimal(amount, 1, 2)}">0.00</span>
        </div>

        <div class="detail">
            <p><strong>Transaction ID:</strong> <span th:text="${transactionId}"></span></p>
            <p><strong>New Balance:</strong>    ৳ <span th:text="${#numbers.formatDecimal(newBalance, 1, 2)}"></span></p>
        </div>

        <p style="margin-top:24px;">If you did not make this request, please contact support immediately.</p>
    </div>
    <div class="footer">© 2025 MyApp. All rights reserved.</div>
</div>
</body>
</html>
